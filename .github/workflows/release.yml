name: Release

# A v* tag builds the desktop app (electron/) for the three platforms and drafts a GitHub release with the installers,
# the update files electron-updater reads (latest*.yml, blockmaps) and SHA256SUMS. The owner publishes the draft;
# the app's update check sees a release only once it is published.
#
# Signing: macOS with the Developer ID certificate (imported into a keychain of the run's own), hardened runtime,
# notarized and stapled; Windows with Azure Artifact Signing through jsign, signed in with GitHub's OIDC token (no
# signing secret is stored). The AppImage is unsigned, covered by SHA256SUMS. The secrets and ids live in the release
# environment, which only v* tags may use.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is the version package.json says
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is not v$version, the version package.json says"
            exit 1
          fi

  linux:
    name: AppImage
    needs: version
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Package
        run: pnpm app:dist
      - name: Start the app
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          xvfb-run -a -s "-screen 0 1600x1000x24" pnpm app:smoke --app release/nwn-nui-designer-*-x86_64.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            release/*.AppImage
            release/latest-linux.yml
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # signs in to Azure with GitHub's OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: jsign
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/jsign-7.6.jar" https://github.com/ebourg/jsign/releases/download/7.6/jsign-7.6.jar
          echo "6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5  $RUNNER_TEMP/jsign-7.6.jar" | sha256sum -c -
      # electron-builder signs the app, the uninstaller and the installer through electron/win-sign.cjs, which runs
      # jsign with the token. The token lives only in this step.
      - name: Package and sign
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          OIDC="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)"
          echo "::add-mask::${OIDC}"
          az login --service-principal -u "$AZURE_CLIENT_ID" -t "$AZURE_TENANT_ID" \
            --federated-token "$OIDC" --allow-no-subscriptions > /dev/null
          NUID_SIGN_TOKEN="$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)"
          echo "::add-mask::${NUID_SIGN_TOKEN}"
          az logout
          export NUID_SIGN_TOKEN NUID_REQUIRE_SIGNING=1
          export JSIGN_JAR="$RUNNER_TEMP/jsign-7.6.jar" NUID_SIGNED_LOG="$RUNNER_TEMP/signed.txt"
          pnpm app:dist
      # What Windows itself sees: every exe a valid signature by the company, and the uninstaller signed too.
      - name: Verify the signatures
        shell: pwsh
        run: |
          Get-Content $env:RUNNER_TEMP\signed.txt
          if (-not (Select-String -Quiet -Pattern 'uninstaller' -Path $env:RUNNER_TEMP\signed.txt)) { throw "the uninstaller was not signed" }
          $files = @(Get-ChildItem release\*.exe) + @(Get-ChildItem -Recurse release\win-unpacked -Include *.exe)
          $bad = $false
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            $cn = if ($s.SignerCertificate) { $s.SignerCertificate.GetNameInfo('SimpleName', $false) } else { '' }
            Write-Host "$($f.Name): $($s.Status) $cn"
            if ($s.Status -ne 'Valid' -or $cn -ne 'ORTH DOT CA Corp') { $bad = $true }
          }
          if ($bad) { throw "an exe is not validly signed by ORTH DOT CA Corp" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            release/*-setup.exe
            release/*-setup.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  macos:
    name: macOS disk image
    needs: version
    runs-on: macos-latest
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Signing keychain
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [ -z "$P12" ]; then
            echo "::error::No Developer ID certificate in the release environment"
            exit 1
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -hex 24)
          echo "::add-mask::${kc_pass}"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          (umask 077; printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12")
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/id.p12"
          # Lets codesign use the key without a prompt nobody can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$kc" > /dev/null
          # shellcheck disable=SC2046 # one keychain path per line, no spaces
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # By hash: the team's Developer ID Application identity, no other.
          id=$(security find-identity -v -p codesigning "$kc" \
            | awk -v t="($TEAM_ID)\"" '/"Developer ID Application: / && index($0, t) { print $2; exit }')
          if [ -z "$id" ]; then
            echo "::error::No Developer ID Application identity for team $TEAM_ID"
            exit 1
          fi
          echo "CSC_NAME=$id" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$kc" >> "$GITHUB_ENV"
      # electron-builder signs inside out with the hardened runtime (electron/build/entitlements.mac.plist), then
      # notarizes and staples the app before it packs the dmg and the zip the updater downloads.
      - name: Package, sign and notarize the app
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/notary.p8"
          (umask 077; printf '%s\n' "$NOTARY_KEY" > "$APPLE_API_KEY")
          pnpm app:dist
      - name: Notarize the disk image
        env:
          NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          dmg=$(ls release/*.dmg)
          app=$(ls -d release/mac-universal/*.app)
          auth=(--key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER")
          xcrun notarytool submit "$dmg" "${auth[@]}" --wait --timeout 1h \
            --output-format json > notary.json || true
          cat notary.json
          sub=$(plutil -extract id raw notary.json)
          status=$(plutil -extract status raw notary.json)
          if [ "$status" != Accepted ]; then
            # Apple's log names each file it refused and why.
            xcrun notarytool log "$sub" "${auth[@]}" || true
            echo "::error::Notarization: $status"
            exit 1
          fi
          xcrun stapler staple "$dmg"
          # The stapled dmg's new checksum, in the update file.
          node electron/restamp-dmg.mjs release
          rm -f release/*.dmg.blockmap
          # What Gatekeeper sees, offline too.
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          spctl --assess --type execute -vv "$app"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"
      - name: Remove the signing keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/id.p12" "$RUNNER_TEMP/notary.p8"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            release/*.dmg
            release/*-mac-universal.zip
            release/*-mac-universal.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  release:
    name: Draft release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS" && mv "$RUNNER_TEMP/SHA256SUMS" . && cat SHA256SUMS
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "NWN NUI Designer $GITHUB_REF_NAME" --generate-notes dist/*
