; nui-designer.ini: where your game, haks and windows are. Copy this file to nui-designer.ini (next to it, in the
; repository root) and fill in what you have, or skip it: `pnpm dev` finds a Steam, GOG or Beamdog install by itself,
; and the editor's Game and haks dialog writes this file when you save there. nui-designer.ini is ignored by git.
;
; `key = value`, one per line. Lines starting with ; or # are comments. `~` is your home folder; a relative path is
; relative to the repository root. Put a value in "double quotes" if it contains a comma.
; The environment beats this file: NWN_ROOT (game), NWN_HAK_DIR (hak_dir), NWN_MODULE_IFO (module_ifo),
; NUI_DESIGNER_STYLES (styles; several separated as in PATH).

; Your NWN:EE install: the folder that holds data/ (with nwn_base.key) and ovr/.
; Steam on Linux:   ~/.local/share/Steam/steamapps/common/Neverwinter Nights
; Steam on Windows: C:\Program Files (x86)\Steam\steamapps\common\Neverwinter Nights
; GOG on macOS:     /Applications/Neverwinter Nights Enhanced Edition.app/Contents/Resources/game
;game = ~/.local/share/Steam/steamapps/common/Neverwinter Nights

; Your module's haks: the folder with the .hak files (default: the game's user folder, ~/.local/share/Neverwinter
; Nights/hak on Linux, Documents/Neverwinter Nights/hak on Windows and macOS) ...
;hak_dir = ~/.local/share/Neverwinter Nights/hak
; ... and their order, from nasher's module.ifo.json (Mod_HakList; the first hak wins) ...
;module_ifo = ../my-module/module.ifo.json
; ... or, without one, the haks by name, best first.
;haks = my_top_hak, my_skin_hak, my_base_hak

; Folders of loose files searched after the haks and before the game (a newer nui_skin.tml, its textures and fonts).
; Comma separated, or one `overrides =` line per folder.
;overrides = ~/.local/share/Neverwinter Nights/development

; A folder of window files (.jui, window JSON, projects, nui-preview dumps): your module's windows, listed on the start
; screen and in the window switcher (click the open window's name in the toolbar).
;windows = local/dumps

; House styles of your own: style files (.json) or folders of them, listed in the editor's Style select beside the
; built-in ones and taken by `pnpm check --style ID`. Start from styles/example.json (README, "Your own house style").
; A style file may name a JavaScript plugin: it runs with your rights, so list only files you trust.
;styles = ~/my-module/nui-style.json
