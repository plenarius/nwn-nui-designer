name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # GitHub-hosted only: the repository is meant to be public, so never a self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version is package.json's packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Install detection at Linux's real default locations (Windows and macOS: install-detection.yml).
      - name: Install detection at the real locations
        env:
          NUID_REAL_INSTALLS: "1"
        run: pnpm exec vitest run tests/detect.real.test.ts

      - name: Build
        run: pnpm build

      # The editor's main flows in headless Chromium, without a game (tests/editor.browser.ts --no-game).
      - name: Browser smoke
        run: |
          pnpm exec playwright-core install --with-deps chromium
          pnpm smoke
